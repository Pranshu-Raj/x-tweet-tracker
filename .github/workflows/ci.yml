name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Test
        run: npm test

      # No TURSO_DATABASE_URL here → the data layer stays lazy and never connects
      # during build (routes are dynamic). No secrets needed to verify the build.
      - name: Build
        run: npm run build
